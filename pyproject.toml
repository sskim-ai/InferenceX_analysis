[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h200-agentx-analysis"
version = "0.1.0"
description = "Reproducible conversation-ID analysis for the InferenceX H200 AgentX benchmark"
requires-python = ">=3.11"
dependencies = [
  "orjson>=3.10",
  "pandas>=2.2",
  "pyarrow>=16",
  "numpy>=1.26",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "scikit-learn>=1.4",
  "duckdb>=1.0",
  "matplotlib>=3.8",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "huggingface_hub>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["vendor", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
